apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  labels:
    app: podinfo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: podinfo
  template:
    metadata:
      labels:
        app: podinfo
    spec:
      containers:
      - name: podinfo
        image: ghcr.io/stefanprodan/podinfo:6.8.0
        ports:
        - name: http
          containerPort: 9898
        env:
        - name: PODINFO_UI_MESSAGE
          value: "Git ist die Wahrheit"
        - name: PODINFO_UI_COLOR
          value: "#6b46c1"
        readinessProbe:
          httpGet: { path: /readyz, port: 9898 }
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet: { path: /healthz, port: 9898 }
          initialDelaySeconds: 5
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { cpu: 200m, memory: 128Mi }
